apiVersion: v1
kind: Service
metadata:
  name: secretsanta-generator-service
  labels:
    app: secretsanta-generator
spec:
  type: LoadBalancer   # Use NodePort if you don’t want external load balancer
  selector:
    app: secretsanta-generator
  ports:
    - protocol: TCP
      port: 80         # Service port
      targetPort: 8080 # Container port
