apiVersion: apps/v1
kind: Deployment
metadata:
  name: secretsanta-generator
  labels:
    app: secretsanta-generator
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1   # Only 1 pod down at a time
      maxSurge: 1         # Add 1 extra pod during rollout
  selector:
    matchLabels:
      app: secretsanta-generator
  template:
    metadata:
      labels:
        app: secretsanta-generator
    spec:
      containers:
        - name: secretsanta-generator
          image: mydockeruser/secretsanta-generator:1.1   # <-- Replace with your Docker Hub repo & version
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health   # Replace with your app’s health endpoint
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health   # Replace with your app’s health endpoint
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
